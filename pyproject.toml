[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxvector"
version = "0.1.0"
description = "Thin HTTP client for Xvector (Milvus REST v2 style)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
server = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "zvec==0.6.0",
  "orjson>=3.10",
  "boto3>=1.34,<2",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-timeout>=2.3",
  "locust>=2.20,<3",
]

[tool.setuptools.packages.find]
include = ["pyxvector*", "xvector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
# Keep long-running Locust prepare/load tests out of default / CI runs.
addopts = ["-m", "not performance"]
markers = [
  "diskann: requires Linux/DiskANN support",
  "performance: Locust performance preparation (excluded from default runs)",
]
